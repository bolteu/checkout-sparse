name: "Sparse Checkout"
description: "Deprecated compatibility wrapper for actions/checkout sparse checkout support"

inputs:
  files:
    description: "List of paths of files and directories to checkout separated by a space"
    required: true
    default: ""
  ref:
    description: "Git ref, branch name or git tag"
    required: true
    default: "dev"
  github-token:
    description: "Github token"
    required: false

runs:
  using: "composite"
  steps:
    - name: Deprecation notice
      shell: bash
      run: |
        echo "::warning title=checkout-sparse is deprecated::Please migrate to actions/checkout with sparse-checkout. See https://github.com/bolteu/checkout-sparse#readme for migration details."

    - name: Normalize sparse checkout paths
      id: sparse-checkout
      shell: bash
      env:
        FILES: ${{ inputs.files }}
      run: |
        set -f
        read -r -a paths <<< "$FILES"

        {
          echo "patterns<<EOF"
          printf '%s\n' "${paths[@]}"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref }}
        token: ${{ inputs.github-token || github.token }}
        sparse-checkout: ${{ steps.sparse-checkout.outputs.patterns }}
        sparse-checkout-cone-mode: true
        fetch-depth: 1
